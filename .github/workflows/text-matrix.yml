name: Verify multiple scientific texts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texts:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node scripts/text-matrix-check.mjs
        env:
          APP_URL: https://marginal-science.vercel.app
          TEST_NEURAL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiple-scientific-texts
          path: artifacts/browser/text-matrix.json
