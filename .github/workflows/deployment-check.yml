name: Verify public deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-deployment.mjs
      - run: node scripts/browser-check.mjs
        env:
          APP_URL: https://marginal-science.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-deployment-verification
          path: |
            artifacts/browser/report.json
            artifacts/browser/*.png
