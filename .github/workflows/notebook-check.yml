name: Verify research notebook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/notebook-check.mjs
        env:
          APP_URL: https://marginal-science.vercel.app
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-${{ matrix.browser }}
          path: |
            artifacts/browser/notebook-*.json
            artifacts/browser/notebook-*.png
            artifacts/browser/review-export-*.json
