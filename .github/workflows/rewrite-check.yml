name: Verify browser-local rewrite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/rewrite-check.mjs
        env:
          APP_URL: https://marginal-science.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-rewrite-verification
          path: |
            artifacts/browser/rewrite.json
            artifacts/browser/rewrite.png
