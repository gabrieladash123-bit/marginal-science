name: Verify browser-local rewrite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5173 > /tmp/marginal-vite.log 2>&1 &
      - run: node scripts/rewrite-check.mjs
        env:
          APP_URL: http://127.0.0.1:5173
      - run: node scripts/humanize-check.mjs
        env:
          APP_URL: http://127.0.0.1:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-rewrite-verification
          path: |
            artifacts/browser/rewrite.json
            artifacts/browser/rewrite.png
            artifacts/browser/humanize*.json
            artifacts/browser/humanize*.png
